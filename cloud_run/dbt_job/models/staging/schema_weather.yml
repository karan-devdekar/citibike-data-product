version: 2

models:
  - name: stg_hourly_weather

    columns:

      - name: weather_time
        tests:
          - not_null
          - unique

      - name: weather_date
        tests:
          - not_null

      - name: temperature_2m
        tests:
          - not_null

      - name: relative_humidity_2m
        tests:
          - not_null

      - name: precipitation
        tests:
          - not_null

      - name: source
        tests:
          - not_null
          - accepted_values:
              values:
                - open-meteo